name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# A newer push to the same branch makes the in-flight run obsolete. Cancel it
# rather than paying for a result nobody will read — but never cancel on main,
# where every commit's result is a record we want to keep.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Reproducible installs and quieter logs.
  CI: true
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false

jobs:
  # ── Static analysis ────────────────────────────────────────────────────────
  # Split from `test` so a formatting failure and a failing test are two
  # independent signals rather than one opaque red X.
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings=0 --format=stylish

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

  # ── Database ───────────────────────────────────────────────────────────────
  # Split from `lint` so a schema problem reads as a schema problem. The static
  # checks run everywhere; the pgTAP suite needs a real Postgres, so it only
  # runs where Docker is available.
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches a table created without RLS, a SECURITY DEFINER function with an
      # unpinned search_path, a view that bypasses RLS, and seeds that reference
      # a table no migration creates. Seconds, not minutes.
      - name: Lint migrations and seed
        run: npm run db:lint

      # seed.sql is generated from src/data/. If someone edits the content
      # modules without regenerating, local databases drift from the app.
      - name: Verify seed is in sync with src/data
        run: npm run db:seed:check

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local stack
        run: supabase start

      # Applies every migration from scratch, then the seed. A migration that
      # only works against an already-migrated database fails here.
      - name: Apply migrations and seed from scratch
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop local stack
        if: always()
        run: supabase stop

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One Node version failing should not hide the result of the others.
      fail-fast: false
      matrix:
        # The version the project targets, plus the next LTS it must keep working on.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        # Only from the primary version — the others would be identical.
        if: matrix.node == '20'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # ── Build & bundle budget ──────────────────────────────────────────────────
  build:
    name: Build & bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: node scripts/report-bundle-size.mjs

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Aggregate gate ─────────────────────────────────────────────────────────
  # Branch protection points at this one job, so adding or renaming a job above
  # never requires editing the protected-checks list.
  ci:
    name: CI
    if: always()
    needs: [lint, database, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - name: All required jobs passed
        run: echo "CI green."
