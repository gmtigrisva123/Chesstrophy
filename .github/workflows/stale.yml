name: Stale issues and pull requests

on:
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-message: >
            This issue has had no activity for 60 days. It will close in 14 days
            unless someone comments. If it still matters, a short note on what is
            still needed is enough to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 30 days. It will close in
            14 days unless it is updated. Reopening later is always fine.
          # Never auto-close work someone has explicitly committed to.
          exempt-issue-labels: "pinned,security,roadmap,good first issue"
          exempt-pr-labels: "pinned,security,work in progress"
          exempt-all-milestones: true
