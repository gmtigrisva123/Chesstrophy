name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # `comment-summary-in-pr` posts the failure summary back onto the PR.
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Blocks a PR that introduces a dependency with a known high-severity
      # advisory, or one under a licence we cannot ship.
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only
