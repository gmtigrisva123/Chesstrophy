name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a maintainer re-publish the current main without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. Queued runs are *not* cancelled: a half-finished
# publish would leave the site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `configure-pages` needs this to turn Pages on the first time it runs, so
    # the workflow is self-sufficient on a fresh repo instead of erroring until
    # someone visits Settings → Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        # Pages serves the site from /<repo>/, so assets need that base path.
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"

      # The app has no server-side router, but Pages returns a hard 404 for any
      # unknown path. Serving index.html as the 404 page keeps deep links working.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
