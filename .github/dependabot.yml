version: 2

updates:
  # ── npm ────────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      # One PR per toolchain rather than a dozen. Each group's members are
      # released together and are almost always reviewed together too.
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      eslint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "globals"]
      vitest:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom"]
      build-tooling:
        patterns: ["vite", "@vitejs/*", "typescript", "prettier"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
