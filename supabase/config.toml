# ChessProphy — Supabase local development configuration.
#
# Applies to `supabase start` / `supabase db reset` only. Hosted projects are
# configured in the dashboard; anything that must match between the two is
# called out in a comment below.
#
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "chessprophy"

[api]
enabled = true
port = 54321
# `graphql_public` is deliberately absent: the app uses PostgREST and the
# JS client only, and every exposed schema is another surface to secure.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# A request that forgets to paginate should not be able to pull the whole
# catalogue. Every list query in src/lib/supabase/ pages explicitly.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the hosted project's major version, or `db diff` produces
# migrations that fail on deploy.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
# Seeds run after migrations on `db reset`. supabase/seed.sql is generated —
# see scripts/generate-supabase-seed.mjs.
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
# Local SMTP catcher: signup and recovery mails land here instead of being sent.
enabled = true
port = 54324

[storage]
enabled = true
# Avatars and ChessFlix thumbnails. Kept small on purpose — the client
# compresses images before upload (see src/lib/media/image.js).
file_size_limit = "5MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "1MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.chessflix]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Anonymous sign-in backs the app's "Continue as Guest" path: a guest gets a
# real (anonymous) user row, so their progress is stored and secured exactly
# like anyone else's, and can be upgraded to a full account later without a
# migration step.
enable_anonymous_sign_ins = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # local only; hosted projects MUST enable this
double_confirm_changes = true
secure_password_change = true

[auth.sessions]
# Nudge inactive sessions out rather than leaving tokens valid indefinitely.
inactivity_timeout = "72h"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
