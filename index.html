<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>ChessProphy — AI-Powered Chess Learning</title>
    <meta
      name="description"
      content="Learn chess with an opening trainer, structured courses, daily puzzles, an AI coach and a personalised learning tree."
    />
    <meta name="author" content="ChessProphy" />
    <meta name="color-scheme" content="dark light" />

    <!-- Matches --cp-page-bg in src/styles/global.css, so the browser chrome and
         the first paint agree instead of flashing white. -->
    <meta name="theme-color" content="#0d1526" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef2fb" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChessProphy" />
    <meta property="og:title" content="ChessProphy — AI-Powered Chess Learning" />
    <meta
      property="og:description"
      content="Opening trainer, structured courses, daily puzzles, an AI coach and a personalised learning tree."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChessProphy — AI-Powered Chess Learning" />
    <meta
      name="twitter:description"
      content="Opening trainer, structured courses, daily puzzles, an AI coach and a personalised learning tree."
    />

    <!-- Inline SVG favicon: no extra request, and it scales cleanly. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563EB'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='white'%3E%E2%99%9E%3C/text%3E%3C/svg%3E"
    />

    <!-- Paint the page background before any CSS or JavaScript loads, so the
         first frame is never the browser's default white. The stylesheet takes
         over from here; see src/styles/global.css. -->
    <style>
      html {
        background-color: #0d1526;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]) {
          background-color: #eef2fb;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div
        style="
          max-width: 34rem;
          margin: 4rem auto;
          padding: 0 1.5rem;
          font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Inter, sans-serif;
          color: #f0f0f0;
          text-align: center;
        "
      >
        <h1 style="font-family: Georgia, serif; font-size: 1.35rem">JavaScript is required</h1>
        <p style="margin-top: 0.75rem; line-height: 1.6; color: #8891a8">
          ChessProphy runs entirely in your browser — the boards, the engine and your saved progress are all
          client-side. Please enable JavaScript to use it.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
